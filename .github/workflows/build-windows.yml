name: Build Windows 10 & 11 EXE

on:
  push:
    branches:
      - main
      - audit-finalization
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Quality, Safety & Unit Tests
        run: npm run check

      - name: Build Windows 10/11 NSIS Installer & Portable EXE
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Architecture and Binary Metadata
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Filter *.exe | ForEach-Object {
            Write-Host "Verifying: $($_.Name) ($($_.Length) bytes)"
            $cert = Get-AuthenticodeSignature $_.FullName
            Write-Host "Signature Status: $($cert.Status)"
          }

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          $hashes = Get-ChildItem -Path release -Filter *.exe | Get-FileHash -Algorithm SHA256
          $hashLines = $hashes | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" }
          $hashLines | Out-File -FilePath release\SHA256SUMS.txt -Encoding ascii
          Write-Host "Generated SHA256SUMS.txt:"
          Get-Content release\SHA256SUMS.txt

      - name: Create Commercial Gumroad Distribution ZIP
        shell: pwsh
        run: |
          $gumroadDir = "release\gumroad_staging"
          New-Item -ItemType Directory -Force -Path $gumroadDir
          Copy-Item "release\8002CleanUp-Windows-Setup-v2.5.0.exe" -Destination $gumroadDir\
          Copy-Item "release\8002CleanUp-Windows-Portable-v2.5.0.exe" -Destination $gumroadDir\
          Copy-Item "release\SHA256SUMS.txt" -Destination $gumroadDir\
          Copy-Item "INSTALLATION.md" -Destination $gumroadDir\
          Copy-Item "LICENSE_ACTIVATION.md" -Destination $gumroadDir\
          Copy-Item "RELEASE_NOTES.md" -Destination $gumroadDir\
          Copy-Item "EULA.txt" -Destination $gumroadDir\
          Copy-Item "COMMERCIAL_README.txt" -Destination $gumroadDir\
          Compress-Archive -Path "$gumroadDir\*" -DestinationPath "release\8002CleanUp-Windows-v2.5.0-Gumroad.zip" -Force
          Write-Host "Gumroad ZIP Created:"
          Get-Item "release\8002CleanUp-Windows-v2.5.0-Gumroad.zip" | Select-Object Name, Length

      - name: Upload Windows EXE & Commercial Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 8002CleanUp-Windows-v2.5.0-Release-Package
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
            release/*.blockmap

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
