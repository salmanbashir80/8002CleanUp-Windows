name: Build Windows 10 & 11 EXE

on:
  push:
    branches:
      - main
      - audit-finalization
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies
        run: npm audit --audit-level=moderate

      - name: Run Quality, Safety & Unit Tests
        run: npm run check

      - name: Build Windows 10/11 NSIS Installer & Portable EXE
        run: npm run dist:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Native Application Settings and Restart Smoke
        run: node test/nativeWindowsSmoke.cjs
        env:
          DEBUG: pw:browser

      - name: Verify Architecture and Binary Metadata
        shell: pwsh
        run: ./tools/verify-windows-release.ps1

      - name: Windows Defender Scan
        shell: pwsh
        run: ./tools/scan-windows-release.ps1

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          $hashes = Get-ChildItem -Path release -Filter *.exe | Get-FileHash -Algorithm SHA256
          $hashLines = $hashes | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" }
          $hashLines | Out-File -FilePath release\SHA256SUMS.txt -Encoding ascii
          Write-Host "Generated SHA256SUMS.txt:"
          Get-Content release\SHA256SUMS.txt

      - name: Create Commercial Gumroad Distribution ZIP
        shell: pwsh
        run: |
          $gumroadDir = "release\gumroad_staging"
          New-Item -ItemType Directory -Force -Path $gumroadDir
          $setupExe = (Get-ChildItem "release\8002CleanUp-Windows-Setup-*.exe" | Select-Object -First 1).FullName
          $portableExe = (Get-ChildItem "release\8002CleanUp-Windows-Portable-*.exe" | Select-Object -First 1).FullName
          Copy-Item $setupExe -Destination $gumroadDir\
          Copy-Item $portableExe -Destination $gumroadDir\
          Copy-Item "release\SHA256SUMS.txt" -Destination $gumroadDir\
          Copy-Item "INSTALLATION.md" -Destination $gumroadDir\
          Copy-Item "LICENSE_ACTIVATION.md" -Destination $gumroadDir\
          Copy-Item "RELEASE_NOTES.md" -Destination $gumroadDir\
          Copy-Item "EULA.txt" -Destination $gumroadDir\
          Copy-Item "COMMERCIAL_README.txt" -Destination "$gumroadDir\README.txt"
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path "$gumroadDir\*" -DestinationPath "release\8002CleanUp-Windows-v$pkgVersion-Gumroad.zip" -Force
          Write-Host "Gumroad ZIP Created:"
          Get-Item "release\8002CleanUp-Windows-v$pkgVersion-Gumroad.zip" | Select-Object Name, Length

      - name: Verify Gumroad ZIP Contents
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "release/8002CleanUp-Windows-v$version-Gumroad.zip"))
          try {
            $expected = @("8002CleanUp-Windows-Setup-v$version.exe", "8002CleanUp-Windows-Portable-v$version.exe", 'SHA256SUMS.txt', 'EULA.txt', 'README.txt', 'INSTALLATION.md', 'LICENSE_ACTIVATION.md', 'RELEASE_NOTES.md')
            $actual = @($zip.Entries | ForEach-Object { $_.FullName })
            if (Compare-Object $expected $actual) { throw 'Gumroad ZIP contents differ from the required manifest' }
            $actual | Set-Content release/GUMROAD_CONTENTS.txt
          } finally { $zip.Dispose() }

      - name: Upload Windows EXE & Commercial Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 8002CleanUp-Windows-Release-Package
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
            release/*.blockmap
            release/BINARY_METADATA.json
            release/DEFENDER_SCAN.json
            release/GUMROAD_CONTENTS.txt
            release/NATIVE_SMOKE.json
            release/NATIVE_SETTINGS.png

      - name: Prepare Draft Release Notes
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/audit-finalization'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          $notes = (Get-Content RELEASE_NOTES.md -Raw) -split "`n---`n", 2
          $body = $notes[0] + "`n`nNative build evidence: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`nSource: $env:GITHUB_SHA`n`nNOT TESTED: installed v2.5.4 to v2.5.5 upgrade, paid-license/settings retention on the QA PC, native Settings interaction, installed-version rollback, and post-publication live update detection. Automated staging cleanup is not installed rollback. Unsigned installers may trigger SmartScreen/UAC. Do not publish until owner acceptance and approval."
          $body | Set-Content release/DRAFT_RELEASE_NOTES.md

      - name: Attach Artifacts to Draft GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/audit-finalization'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: 8002CleanUp Pro for Windows v${{ env.RELEASE_VERSION }} — QA Draft
          draft: true
          body_path: release/DRAFT_RELEASE_NOTES.md
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
            release/BINARY_METADATA.json
            release/DEFENDER_SCAN.json
            release/GUMROAD_CONTENTS.txt
            release/NATIVE_SMOKE.json
            release/NATIVE_SETTINGS.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Draft GitHub Release (on owner-approved tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
